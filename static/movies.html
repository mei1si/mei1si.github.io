<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f0">
<title>我的观影岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ============ Animal-Island-UI 设计 Token ============ */
  :root {
    --animal-font: Nunito, 'Noto Sans SC', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    --tr: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --tr-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);

    /* 共用色 */
    --primary: #19c8b9;
    --primary-hover: #3dd4c6;
    --primary-active: #11a89b;
    --focus-yellow: #ffcc00;
    --focus-yellow-dark: #e0b800;
    --rating-yellow: #f5c31c;
    --rating-yellow-dark: #d4a030;
    --status-watched: #6fba2c;
    --status-watching: #f5c31c;
    --status-unwatched: #9f927d;
  }

  /* 浅色主题 = 白天的小岛(奶油米白 + 大地棕) */
  [data-theme="light"] {
    color-scheme: light;
    --bg-base: #f8f8f0;
    --bg-content: rgb(247, 243, 223);
    --bg-input: rgb(247, 243, 223);
    --bg-input-disabled: #ece8dc;
    --bg-tag: #fffaea;
    --bg-blob-1: #f7cd67;
    --bg-blob-2: #82d5bb;
    --bg-blob-3: #f8a6b2;
    --bg-overlay: rgba(61, 52, 40, 0.85);

    --text-primary: #794f27;
    --text-body: #725d42;
    --text-secondary: #9f927d;
    --text-muted: #8a7b66;
    --text-disabled: #c4b89e;
    --text-on-tag: #5a3a18;

    --border: #c4b89e;
    --border-hover: #a89878;
    --border-light: #e0d6bc;

    --shadow-3d: #bdaea0;
    --shadow-input: #d4c9b4;
    --shadow-base: 0 3px 10px 0 rgba(61, 52, 40, 0.12);
    --shadow-sm: 0 2px 4px 0 rgba(61, 52, 40, 0.06);
    --shadow-lg: 0 8px 24px 0 rgba(61, 52, 40, 0.18);

    --bg-page: radial-gradient(ellipse at top right, #fff8d6 0%, #f8f8f0 45%, #f3eed6 100%);
    --select-arrow: %23725d42;
  }

  /* 深色主题 = 夜晚的森林岛(深森林绿 + 奶油米白文字 —— 不用纯黑) */
  [data-theme="dark"] {
    color-scheme: dark;
    --bg-base: #2a3530;
    --bg-content: #344036;
    --bg-input: #3a463c;
    --bg-input-disabled: #2f3a32;
    --bg-tag: #3e4a40;
    --bg-blob-1: #19c8b9;
    --bg-blob-2: #6fba2c;
    --bg-blob-3: #f5c31c;
    --bg-overlay: rgba(20, 30, 24, 0.88);

    --text-primary: #fff9e3;
    --text-body: #f3ecd0;
    --text-secondary: #c4b89e;
    --text-muted: #b3a685;
    --text-disabled: #7a705f;
    --text-on-tag: #2a1a08;

    --border: #6e7a64;
    --border-hover: #8a9580;
    --border-light: #4d5a4f;

    --shadow-3d: #1a2218;
    --shadow-input: #1f2820;
    --shadow-base: 0 4px 14px 0 rgba(0, 0, 0, 0.35);
    --shadow-sm: 0 2px 6px 0 rgba(0, 0, 0, 0.20);
    --shadow-lg: 0 8px 28px 0 rgba(0, 0, 0, 0.45);

    --bg-page: radial-gradient(ellipse at top right, #3a4d3f 0%, #2a3530 50%, #243029 100%);
    --select-arrow: %23f3ecd0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--animal-font);
    font-weight: 500;
    letter-spacing: 0.01em;
    background: var(--bg-page);
    color: var(--text-body);
    min-height: 100vh;
    padding: 28px;
    padding-top: max(28px, env(safe-area-inset-top));
    padding-bottom: max(28px, env(safe-area-inset-bottom));
    transition: background var(--tr), color var(--tr);
    overflow-x: hidden;
    position: relative;
  }

  /* ============ 背景 blob 装饰光斑 ============ */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.32;
    pointer-events: none;
    z-index: -1;
    animation: float 22s ease-in-out infinite;
  }
  body::before {
    width: 540px; height: 540px;
    background: var(--bg-blob-1);
    top: -200px; right: -120px;
  }
  body::after {
    width: 600px; height: 600px;
    background: var(--bg-blob-2);
    bottom: -220px; left: -200px;
    animation-delay: -10s;
  }
  .blob-3 {
    position: fixed;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: var(--bg-blob-3);
    filter: blur(110px);
    opacity: 0.22;
    pointer-events: none;
    z-index: -1;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    animation: float 26s ease-in-out infinite -5s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(50px, -30px) scale(1.08); }
    66% { transform: translate(-30px, 50px) scale(0.94); }
  }

  /* ============ 整体最大宽度容器 ============ */
  .layout {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ============ 容器(动森卡片：实色奶油底 + 棕边框，无毛玻璃) ============ */
  .glass {
    background: var(--bg-content);
    border: 2px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow-base);
  }

  /* ============ 顶部 Header ============ */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 14px;
  }

  /* h1 = 动森飘带横幅 */
  h1 {
    display: inline-flex;
    align-items: center;
    height: 2.1em;
    padding: 0 1.4em;
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 800;
    font-family: var(--animal-font);
    letter-spacing: 0.04em;
    line-height: 1;
    color: #fff9e3;
    background: linear-gradient(135deg, #19c8b9 0%, #11a89b 100%);
    border-radius: 16px 28px 16px 28px / 18px 24px 18px 24px;
    box-shadow: 0 5px 0 0 var(--shadow-3d), 0 10px 22px rgba(25, 200, 185, 0.28);
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.14);
    transition: transform var(--tr);
  }
  h1:hover { transform: translateY(-1px) rotate(-0.5deg); }

  /* 主题切换按钮 = 动森黄色 3D 厚阴影圆按键 */
  .theme-toggle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2.5px solid var(--bg-content);
    cursor: pointer;
    background: var(--bg-content);
    color: var(--text-primary);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--tr);
    box-shadow: 0 5px 0 0 var(--shadow-3d);
    font-family: var(--animal-font);
    line-height: 1;
  }
  .theme-toggle:hover {
    transform: translateY(-1px) rotate(10deg);
    box-shadow: 0 6px 0 0 var(--shadow-3d);
  }
  .theme-toggle:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 0 var(--shadow-3d);
  }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* ============ 控件区 ============ */
  .controls {
    padding: 18px 22px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }
  .control-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-body);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .control-item label {
    white-space: nowrap;
    color: var(--text-primary);
  }

  /* input —— 动森 pill 输入框 */
  input[type="text"] {
    background: var(--bg-input);
    color: var(--text-body);
    border: 2.5px solid var(--border);
    height: 42px;
    padding: 0 18px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--animal-font);
    letter-spacing: 0.01em;
    outline: none;
    transition: all var(--tr);
    cursor: text;
    box-shadow: 0 3px 0 0 var(--shadow-input);
  }
  input[type="text"]:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 0 0 var(--shadow-input);
  }
  input[type="text"]:focus {
    border-color: var(--focus-yellow);
    box-shadow: 0 3px 0 0 var(--focus-yellow-dark), 0 0 0 3px rgba(255, 204, 0, 0.18);
  }

  /* 隐藏原生 select（保留作为数据源） */
  select.ai-native {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    margin: 0;
    padding: 0;
    border: 0;
  }

  /* ============ 自定义动森 Select ============ */
  .ai-select {
    position: relative;
    display: inline-block;
    font-family: var(--animal-font);
  }
  .ai-select-trigger {
    background: var(--bg-input);
    color: var(--text-body);
    border: 2.5px solid var(--border);
    height: 42px;
    padding: 0 44px 0 18px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--animal-font);
    letter-spacing: 0.01em;
    outline: none;
    transition: all var(--tr);
    cursor: pointer;
    box-shadow: 0 3px 0 0 var(--shadow-input);
    display: inline-flex;
    align-items: center;
    min-width: 110px;
    text-align: left;
    line-height: 1;
    position: relative;
  }
  .ai-select-trigger::after {
    content: '';
    position: absolute;
    right: 16px;
    top: 50%;
    width: 10px;
    height: 10px;
    border-right: 2.5px solid var(--text-body);
    border-bottom: 2.5px solid var(--text-body);
    transform: translateY(-75%) rotate(45deg);
    transition: transform var(--tr);
    pointer-events: none;
  }
  .ai-select.is-open .ai-select-trigger::after {
    transform: translateY(-25%) rotate(-135deg);
  }
  .ai-select-trigger:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 0 0 var(--shadow-input);
  }
  .ai-select-trigger:focus-visible,
  .ai-select.is-open .ai-select-trigger {
    border-color: var(--focus-yellow);
    box-shadow: 0 3px 0 0 var(--focus-yellow-dark), 0 0 0 3px rgba(255, 204, 0, 0.20);
  }

  /* 下拉面板 */
  .ai-select-panel {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    min-width: 100%;
    background: var(--bg-content);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 8px;
    box-shadow: 0 8px 24px 0 rgba(61, 52, 40, 0.18), 0 4px 0 0 var(--shadow-input);
    z-index: 100;
    opacity: 0;
    transform: translateY(-6px) scale(0.96);
    transform-origin: top center;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 320px;
    overflow-y: auto;
  }
  [data-theme="dark"] .ai-select-panel {
    box-shadow: 0 8px 28px 0 rgba(0, 0, 0, 0.5), 0 4px 0 0 var(--shadow-input);
  }
  .ai-select.is-open .ai-select-panel {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .ai-select-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px 9px 12px;
    border-radius: 50px;
    color: var(--text-body);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: all var(--tr-fast);
    user-select: none;
    white-space: nowrap;
    line-height: 1.3;
    border: 2px solid transparent;
  }
  .ai-select-option::before {
    content: '';
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all var(--tr-fast);
  }
  .ai-select-option:hover {
    background: rgba(25, 200, 185, 0.12);
    color: var(--text-primary);
    transform: translateX(2px);
  }
  .ai-select-option:hover::before {
    border-color: var(--primary);
  }
  .ai-select-option.is-selected {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-active) 100%);
    color: #fff9e3;
    font-weight: 700;
  }
  .ai-select-option.is-selected::before {
    background: #fff9e3;
    border-color: #fff9e3;
    box-shadow: inset 0 0 0 4px var(--primary);
  }
  .ai-select-option.is-active:not(.is-selected) {
    background: rgba(25, 200, 185, 0.18);
    color: var(--text-primary);
    border-color: var(--primary);
  }

  /* 面板自定义滚动条 */
  .ai-select-panel::-webkit-scrollbar { width: 8px; }
  .ai-select-panel::-webkit-scrollbar-thumb {
    background: var(--border-light);
    border-radius: 50px;
  }
  .ai-select-panel::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  ::placeholder { color: var(--text-disabled); font-weight: 400; }
  ::selection { background: rgba(25, 200, 185, 0.30); color: var(--text-primary); }

  input[type="text"] {
    cursor: text;
    min-width: 220px;
    flex: 1;
  }

  .stats {
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-left: auto;
    padding: 8px 18px;
    background: var(--bg-tag);
    border: 2px solid var(--border);
    border-radius: 50px;
    box-shadow: 0 2px 0 0 var(--shadow-input);
  }

  /* ============ Kind Tabs（参考 Tabs 组件：teal pill 激活态） ============ */
  .kind-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    padding: 8px;
    background: var(--bg-content);
    border: 2px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow-base);
  }
  .kind-tab {
    flex: 1;
    min-width: 110px;
    padding: 11px 20px;
    border-radius: 50px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    font-family: var(--animal-font);
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all var(--tr);
    line-height: 1;
  }
  .kind-tab:hover {
    background: rgba(25, 200, 185, 0.12);
    color: var(--text-body);
  }
  .kind-tab.active {
    background: var(--primary);
    color: #fff9e3;
    font-weight: 700;
    box-shadow: 0 3px 0 0 var(--primary-active);
    transform: translateY(-1px);
  }
  .kind-tab:focus-visible {
    outline: 2px solid var(--focus-yellow);
    outline-offset: 2px;
  }

  /* ============ 筛选区(带波点墙纸) ============ */
  .filter-section {
    padding: 24px 26px;
    margin-bottom: 26px;
    position: relative;
    overflow: hidden;
  }
  .filter-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle, rgba(25, 200, 185, 0.10) 1.5px, transparent 1.5px) 0 0/28px 28px,
      radial-gradient(circle, rgba(25, 200, 185, 0.06) 1px, transparent 1px) 7px 7px/14px 14px;
    pointer-events: none;
    z-index: 0;
  }
  [data-theme="dark"] .filter-section::before {
    background:
      radial-gradient(circle, rgba(247, 205, 103, 0.07) 1.5px, transparent 1.5px) 0 0/28px 28px,
      radial-gradient(circle, rgba(247, 205, 103, 0.04) 1px, transparent 1px) 7px 7px/14px 14px;
  }
  .filter-section > * { position: relative; z-index: 1; }

  .filter-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.02em;
  }
  .filter-title:not(:first-child) { margin-top: 22px; }
  .filter-hint {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--bg-tag);
    padding: 3px 10px;
    border-radius: 50px;
    border: 1.5px solid var(--border-light);
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* ============ tag 通用 pill ============ */
  .tag {
    background: var(--bg-tag);
    color: var(--text-body);
    padding: 7px 16px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--animal-font);
    letter-spacing: 0.02em;
    cursor: pointer;
    user-select: none;
    transition: all var(--tr);
    border: 2px solid var(--border);
    white-space: nowrap;
    position: relative;
    line-height: 1.4;
  }
  .tag:hover {
    background: var(--bg-input);
    transform: translateY(-1px);
    border-color: var(--primary);
    color: var(--text-primary);
    box-shadow: 0 3px 0 0 var(--shadow-input);
  }
  .tag.active {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-active) 100%);
    color: #fff9e3;
    border-color: transparent;
    box-shadow: 0 4px 0 0 var(--primary-active);
    transform: translateY(-1px);
  }
  .tag.exclude {
    background: var(--bg-tag) !important;
    color: var(--text-disabled) !important;
    text-decoration: line-through;
    opacity: 0.55;
    border-color: var(--border-light) !important;
    box-shadow: none !important;
    transform: none !important;
  }

  /* 分类标签彩色变体 */
  .tag.genre-tag {
    background: var(--g-bg);
    color: var(--g-color);
    border-color: var(--g-border);
  }
  .tag.genre-tag:hover {
    background: var(--g-hover);
    border-color: var(--g-color);
    box-shadow: 0 3px 0 0 var(--g-border);
  }
  .tag.genre-tag.active {
    background: linear-gradient(135deg, var(--g-color), var(--g-color-2));
    color: var(--text-on-tag);
    border-color: transparent;
    box-shadow: 0 4px 0 0 var(--g-border);
  }
  [data-theme="light"] .tag.genre-tag {
    color: var(--text-on-tag);
    background: color-mix(in srgb, var(--g-color) 26%, #fffaea);
    border-color: color-mix(in srgb, var(--g-color) 60%, transparent);
  }
  [data-theme="light"] .tag.genre-tag:hover {
    background: color-mix(in srgb, var(--g-color) 42%, #fffaea);
    border-color: var(--g-color);
  }
  [data-theme="dark"] .tag.genre-tag {
    color: var(--g-color);
    background: color-mix(in srgb, var(--g-color) 18%, var(--bg-content));
    border-color: color-mix(in srgb, var(--g-color) 50%, transparent);
  }
  [data-theme="dark"] .tag.genre-tag:hover {
    background: color-mix(in srgb, var(--g-color) 30%, var(--bg-content));
    border-color: var(--g-color);
  }

  /* ============ 分组 ============ */
  .group-section {
    margin-bottom: 36px;
    animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .group-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-primary);
    font-family: var(--animal-font);
    letter-spacing: 0.02em;
  }
  .group-title::before {
    content: '🌿';
    font-size: 18px;
    animation: leafWiggle 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes leafWiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(10deg); }
  }
  .group-count {
    font-size: 11px;
    font-weight: 800;
    color: #fff9e3;
    padding: 3px 12px;
    background: var(--primary);
    border-radius: 50px;
    letter-spacing: 0.04em;
    box-shadow: 0 2px 0 0 var(--primary-active);
  }

  /* ============ 卡片网格 ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
  }

  .card {
    position: relative;
    background: var(--bg-content);
    border: 2px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    cursor: pointer;
    transition: all var(--tr);
    text-decoration: none;
    color: inherit;
    display: block;
    box-shadow: 0 4px 0 0 var(--shadow-input), var(--shadow-sm);
    animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 0 0 var(--shadow-input), 0 14px 28px rgba(25, 200, 185, 0.22);

  }
  .card:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 0 var(--shadow-input);
  }
  .card:focus-visible {
    outline: 2px solid var(--focus-yellow);

  }

  .poster-wrap {
    position: relative;
    overflow: hidden;
    aspect-ratio: 2/3;

  }

  .poster-overlay {

  /* 评分徽章 = 动森黄圆胶囊 */
  .rating-badge {

    background: var(--rating-yellow);

  .card-info { padding: 14px 14px 16px; }

  .card-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;

    color: var(--text-primary);

    overflow: hidden;

  .card-meta > span:first-child {
    background: var(--bg-tag);
    padding: 2px 9px;

  .card-tags {
    display: flex;

  .card-tag {
    font-size: 10px;
    padding: 2px 9px;
    border-radius: 50px;
    background: color-mix(in srgb, var(--g-color) 18%, transparent);
    color: var(--g-color);
    border: 1.5px solid color-mix(in srgb, var(--g-color) 38%, transparent);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.5;
  }
  [data-theme="light"] .card-tag {
    color: var(--text-on-tag);
    background: color-mix(in srgb, var(--g-color) 26%, #fffaea);
    border-color: color-mix(in srgb, var(--g-color) 55%, transparent);
  }

  /* ============ 加载动画 ============ */
  .loader {
    display: flex;
    justify-content: center;
    padding: 80px 20px;
  }
  .loader-dots { display: flex; gap: 12px; }
  .loader-dots span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 2px 0 0 var(--primary-active);

  .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
  .loader-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6) translateY(0); opacity: 0.5; }
    40% { transform: scale(1) translateY(-8px); opacity: 1; }

  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-body);
    font-weight: 600;
    background: var(--bg-content);

  .empty-state-icon {
    font-size: 60px;
    margin-bottom: 18px;

    animation: leafWiggle 2.5s ease-in-out infinite;

  .empty-state code {

  /* ============ 移动端适配 ============ */
  @media (max-width: 640px) {

    .filter-section { padding: 18px; }
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;

    .card-info { padding: 11px 12px 13px; }

    /* 移动端禁用 hover */
    .card:hover {

    .poster-overlay { display: none; }
  }
  @media (max-width: 380px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ============ 滚动条美化 ============ */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 50px;
    border: 3px solid transparent;

  ::-webkit-scrollbar-thumb:hover {

  * { -webkit-tap-highlight-color: transparent; }

  /* ============ 观看状态徽章 ============ */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 50px;
    font-size: 10px;

    line-height: 1.5;
    letter-spacing: 0.04em;

  .status-badge::before {

  .status-watched { color: var(--status-watched); }
  .status-watching { color: var(--status-watching); }
  .status-unwatched { color: var(--status-unwatched); }

  .tag.status-tag[data-st="watched"]   { --g-color: var(--status-watched);   --g-color-2: #5a9e1e; }
  .tag.status-tag[data-st="watching"]  { --g-color: var(--status-watching);  --g-color-2: #dba90e; }

  .tag.status-tag {
    background: color-mix(in srgb, var(--g-color) 18%, var(--bg-tag));
    color: var(--g-color);
    border: 2px solid color-mix(in srgb, var(--g-color) 50%, transparent);
  }
  .tag.status-tag:hover {
    background: color-mix(in srgb, var(--g-color) 28%, var(--bg-tag));
    border-color: var(--g-color);
    box-shadow: 0 3px 0 0 color-mix(in srgb, var(--g-color) 60%, transparent);
  }
  .tag.status-tag.active {
    background: var(--g-color);

</style>

<body data-theme="light">

<div class="blob-3"></div>

<div class="layout">

<div class="header">
  <h1>🎬 我的观影岛</h1>
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
    <span id="themeIcon">☀️</span>
  </button>
</div>

<div class="controls glass">
  <div class="control-item">
    <label>分组</label>
    <select id="groupBy" class="ai-native">
      <option value="none">不分组</option>
      <option value="year">按年份</option>
      <option value="genre">按分类</option>
      <option value="rating">按评分</option>
    </select>
  </div>
  <div class="control-item">
    <label>排序</label>
    <select id="sortBy" class="ai-native">
      <option value="title">标题</option>
      <option value="year">年份</option>
      <option value="rating">评分</option>
    </select>
  </div>
  <input type="text" id="searchBox" placeholder="🔍 搜索标题（全局）...">
  <span class="stats" id="stats"></span>
</div>

<div class="kind-tabs" id="kindTabs">
  <button class="kind-tab active" data-kind="movie">🎬 电影</button>
  <button class="kind-tab" data-kind="tv">📺 电视</button>
  <button class="kind-tab" data-kind="anime">🌸 动漫</button>
</div>

<div class="filter-section glass">
  <div class="filter-title">
    🏷️ 分类筛选
    <span class="filter-hint">单击选中 · 双击排除</span>
  </div>
  <div class="filter-row" id="genreFilters"></div>

  <div class="filter-title">📅 年份筛选</div>
  <div class="filter-row" id="yearFilters"></div>

  <div class="filter-title">👁️ 状态筛选</div>
  <div class="filter-row" id="statusFilters"></div>
</div>

<div id="container">
  <div class="loader"><div class="loader-dots"><span></span><span></span><span></span></div></div>
</div>

</div>

<script>
// ==================================================
// 电影数据 (从 movies.json 异步加载，方便后续写入)
// ==================================================
let movies = [];

async function loadMovies() {
  try {
    const res = await fetch('movies.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    movies = await res.json();
  } catch (err) {
    console.error('加载 movies.json 失败:', err);
    document.getElementById('container').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div>加载 movies.json 失败：${err.message}</div>
        <div style="margin-top:10px;font-size:12px;opacity:0.85">
          直接双击打开 HTML 时浏览器会因 CORS 拒绝读取本地 JSON。<br>
          请在该目录运行 <code>python -m http.server</code>，再访问 http://localhost:8000/123.html
        </div>
      </div>
    `;
    throw err;
  }
}

// ==================================================
// 应用逻辑
// ==================================================
const TMDB_URL = (movie) => movie.url;

const state = {
  groupBy: 'none',
  sortBy: 'title',
  logic: 'and',
  search: '',
  kind: 'movie',
  selectedGenres: new Set(),
  excludedGenres: new Set(),
  selectedYears: new Set(),
  selectedStatuses: new Set(),
  theme: localStorage.getItem('theme') || 'light',
};

const STATUS_LABELS = {
  watched: '已看',
  watching: '在看',
  unwatched: '未看',
};

// 初始化主题
document.body.dataset.theme = state.theme;
document.getElementById('themeIcon').textContent = state.theme === 'dark' ? '🌙' : '☀️';
document.querySelector('meta[name="theme-color"]').content =
  state.theme === 'dark' ? '#2a3530' : '#f8f8f0';

document.getElementById('themeToggle').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = state.theme;
  document.getElementById('themeIcon').textContent = state.theme === 'dark' ? '🌙' : '☀️';
  document.querySelector('meta[name="theme-color"]').content =
    state.theme === 'dark' ? '#2a3530' : '#f8f8f0';
  localStorage.setItem('theme', state.theme);
};

// 分类标签调色板（hash 映射，颜色稳定 —— 沿用动森 NookPhone 13 色系）
const GENRE_PALETTE = [
  { c: '#fc736d', c2: '#e05a5a' }, // app-red 红
  { c: '#e59266', c2: '#c97550' }, // app-orange 橙
  { c: '#f7cd67', c2: '#d4a030' }, // app-yellow 黄
  { c: '#8ac68a', c2: '#6fba2c' }, // app-green 绿
  { c: '#82d5bb', c2: '#19c8b9' }, // app-teal 薄荷
  { c: '#889df0', c2: '#6373d8' }, // app-blue 蓝
  { c: '#b77dee', c2: '#9050d0' }, // purple 紫
  { c: '#f8a6b2', c2: '#e07585' }, // app-pink 粉
  { c: '#d1da49', c2: '#a3b026' }, // lime-green 黄绿
  { c: '#e18c6f', c2: '#c97050' }, // warm-peach-pink 桃粉
];
function genreColorIndex(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h % GENRE_PALETTE.length;
}
function applyGenreColors(el, name) {
  const p = GENRE_PALETTE[genreColorIndex(name)];
  const hex = p.c.replace('#', '');
  const r = parseInt(hex.substr(0, 2), 16);
  const g = parseInt(hex.substr(2, 2), 16);
  const b = parseInt(hex.substr(4, 2), 16);
  el.style.setProperty('--g-color', p.c);
  el.style.setProperty('--g-color-2', p.c2);
  el.style.setProperty('--g-bg', `rgba(${r},${g},${b},0.16)`);
  el.style.setProperty('--g-hover', `rgba(${r},${g},${b},0.28)`);
  el.style.setProperty('--g-border', `rgba(${r},${g},${b},0.40)`);
  el.style.setProperty('--g-glow', `rgba(${r},${g},${b},0.45)`);
}

function moviesOfKind() {
  return movies.filter(m => (m.kind || 'movie') === state.kind);
}

function getAllGenres() {
  const s = new Set();
  moviesOfKind().forEach(m => m.genres.forEach(g => s.add(g)));
  return [...s].sort((a, b) => a.localeCompare(b, 'zh'));
}

function getAllYears() {
  return [...new Set(moviesOfKind().map(m => m.year))].sort((a, b) => b - a);
}

function renderFilters() {
  const gf = document.getElementById('genreFilters');
  gf.innerHTML = '';
  getAllGenres().forEach(g => {
    const el = document.createElement('span');
    el.className = 'tag genre-tag';
    el.textContent = g;
    applyGenreColors(el, g);
    if (state.selectedGenres.has(g)) el.classList.add('active');
    if (state.excludedGenres.has(g)) el.classList.add('exclude');

    let clickTimer = null;
    el.onclick = (e) => {
      if (clickTimer) return;
      clickTimer = setTimeout(() => {
        if (state.excludedGenres.has(g)) {
          state.excludedGenres.delete(g);
        } else if (state.selectedGenres.has(g)) {
          state.selectedGenres.delete(g);
        } else {
          state.selectedGenres.add(g);
        }
        clickTimer = null;
        render();
      }, 220);
    };
    el.ondblclick = () => {
      clearTimeout(clickTimer);
      clickTimer = null;
      state.selectedGenres.delete(g);
      if (state.excludedGenres.has(g)) {
        state.excludedGenres.delete(g);
      } else {
        state.excludedGenres.add(g);
      }
      render();
    };
    gf.appendChild(el);
  });

  const yf = document.getElementById('yearFilters');
  yf.innerHTML = '';
  getAllYears().forEach(y => {
    const el = document.createElement('span');
    el.className = 'tag';
    el.textContent = y;
    if (state.selectedYears.has(y)) el.classList.add('active');
    el.onclick = () => {
      if (state.selectedYears.has(y)) state.selectedYears.delete(y);
      else state.selectedYears.add(y);
      render();
    };
    yf.appendChild(el);
  });

  const sf = document.getElementById('statusFilters');
  sf.innerHTML = '';
  ['watched', 'watching', 'unwatched'].forEach(st => {
    const el = document.createElement('span');
    el.className = 'tag status-tag';
    el.dataset.st = st;
    el.textContent = STATUS_LABELS[st];
    if (state.selectedStatuses.has(st)) el.classList.add('active');
    el.onclick = () => {
      if (state.selectedStatuses.has(st)) state.selectedStatuses.delete(st);
      else state.selectedStatuses.add(st);
      render();
    };
    sf.appendChild(el);
  });
}

function filterMovies() {
  const isAnd = state.logic === 'and';
  const hasSearch = !!state.search;
  return movies.filter(m => {
    if (hasSearch) {
      if (!m.title.toLowerCase().includes(state.search.toLowerCase())) return false;
      return true;
    }
    if ((m.kind || 'movie') !== state.kind) return false;
    if ([...state.excludedGenres].some(g => m.genres.includes(g))) return false;

    const st = m.status || 'unwatched';
    const genreSel = [...state.selectedGenres];
    const genreHit = genreSel.length === 0 ? null : genreSel.some(g => m.genres.includes(g));
    const yearHit = state.selectedYears.size === 0 ? null : state.selectedYears.has(m.year);
    const statusHit = state.selectedStatuses.size === 0 ? null : state.selectedStatuses.has(st);

    const checks = [genreHit, yearHit, statusHit].filter(v => v !== null);
    if (checks.length === 0) return true;
    return isAnd ? checks.every(Boolean) : checks.some(Boolean);
  });
}

function sortMovies(list) {
  const sorted = [...list];
  switch (state.sortBy) {
    case 'title': sorted.sort((a, b) => a.title.localeCompare(b.title, 'zh')); break;
    case 'year': sorted.sort((a, b) => b.year - a.year); break;
    case 'rating': sorted.sort((a, b) => b.rating - a.rating); break;
  }
  return sorted;
}

function groupMovies(list) {
  if (state.groupBy === 'none') return { '全部': list };
  const groups = {};
  list.forEach(m => {
    let keys = [];
    if (state.groupBy === 'year') keys = [m.year];
    else if (state.groupBy === 'genre') keys = m.genres;
    else if (state.groupBy === 'rating') {
      const r = Math.floor(m.rating);
      keys = [`${r} - ${r + 1} 分`];
    }
    keys.forEach(k => {
      if (!groups[k]) groups[k] = [];
      groups[k].push(m);
    });
  });

  const sortedKeys = Object.keys(groups).sort((a, b) => {
    if (state.groupBy === 'year' || state.groupBy === 'rating') {
      return String(b).localeCompare(String(a));
    }
    return String(a).localeCompare(String(b), 'zh');
  });

  const result = {};
  sortedKeys.forEach(k => result[k] = groups[k]);
  return result;
}

function renderCard(m, index) {
  return `
    <a class="card" href="${TMDB_URL(m)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(index * 0.03, 0.5)}s">
      <div class="poster-wrap">
        <img src="${m.poster}" alt="${m.title}" loading="lazy"
             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22><rect fill=%22%23f7f3df%22 width=%22200%22 height=%22300%22/><text x=%22100%22 y=%22150%22 fill=%22%239f927d%22 text-anchor=%22middle%22 font-size=%2218%22 font-family=%22sans-serif%22>无图</text></svg>'">
        <div class="rating-badge">★ ${m.rating}</div>
        <div class="poster-overlay">
          <div class="poster-overlay-text">${m.overview || '暂无简介'}</div>
        </div>
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">
          <span>${m.year}</span>
          <span class="status-badge status-${m.status || 'unwatched'}">${STATUS_LABELS[m.status] || STATUS_LABELS.unwatched}</span>
        </div>
        <div class="card-tags">
          ${m.genres.slice(0, 3).map(g => {
            const p = GENRE_PALETTE[genreColorIndex(g)];
            return `<span class="card-tag" style="--g-color:${p.c};--g-color-2:${p.c2}">${g}</span>`;
          }).join('')}
        </div>
      </div>
    </a>
  `;
}

function render() {
  renderFilters();
  const filtered = filterMovies();
  const sorted = sortMovies(filtered);
  const groups = groupMovies(sorted);

  document.getElementById('stats').textContent =
    state.search
      ? `${filtered.length} / ${movies.length} 部 (全局搜索)`
      : `${filtered.length} / ${moviesOfKind().length} 部`;

  const container = document.getElementById('container');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🎭</div>
        <div>没有匹配的电影</div>
      </div>
    `;
    return;
  }

  container.innerHTML = '';
  Object.entries(groups).forEach(([key, list]) => {
    const section = document.createElement('div');
    section.className = 'group-section';
    section.innerHTML = `
      <div class="group-title">
        ${key}
        <span class="group-count">${list.length}</span>
      </div>
      <div class="grid">${list.map((m, i) => renderCard(m, i)).join('')}</div>
    `;
    container.appendChild(section);
  });
}

// ==================================================
// 动森风自定义 Select —— 包装原生 select，触发原生 onchange
// ==================================================
function enhanceSelect(nativeSelect) {
  const wrapper = document.createElement('div');
  wrapper.className = 'ai-select';

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'ai-select-trigger';
  trigger.setAttribute('aria-haspopup', 'listbox');
  trigger.setAttribute('aria-expanded', 'false');

  const panel = document.createElement('div');
  panel.className = 'ai-select-panel';
  panel.setAttribute('role', 'listbox');

  const options = Array.from(nativeSelect.options);
  let activeIndex = options.findIndex(o => o.selected);
  if (activeIndex < 0) activeIndex = 0;

  function syncTriggerLabel() {
    trigger.textContent = nativeSelect.options[nativeSelect.selectedIndex]?.text || '';
  }
  function syncPanelSelected() {
    panel.querySelectorAll('.ai-select-option').forEach((el, i) => {
      el.classList.toggle('is-selected', i === nativeSelect.selectedIndex);
    });
  }
  function setActive(i) {
    activeIndex = i;
    panel.querySelectorAll('.ai-select-option').forEach((el, idx) => {
      el.classList.toggle('is-active', idx === activeIndex);
    });
  }

  options.forEach((opt, i) => {
    const item = document.createElement('div');
    item.className = 'ai-select-option';
    item.setAttribute('role', 'option');
    item.dataset.value = opt.value;
    item.textContent = opt.text;
    if (opt.selected) item.classList.add('is-selected');
    item.onmouseenter = () => setActive(i);
    item.onclick = () => {
      if (nativeSelect.value !== opt.value) {
        nativeSelect.value = opt.value;
        nativeSelect.dispatchEvent(new Event('change', { bubbles: true }));
      }
      syncTriggerLabel();
      syncPanelSelected();
      close();
    };
    panel.appendChild(item);
  });

  function open() {
    document.querySelectorAll('.ai-select.is-open').forEach(el => {
      if (el !== wrapper) el.classList.remove('is-open');
    });
    wrapper.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
    setActive(nativeSelect.selectedIndex >= 0 ? nativeSelect.selectedIndex : 0);
  }
  function close() {
    wrapper.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
  }
  function toggle() {
    wrapper.classList.contains('is-open') ? close() : open();
  }

  trigger.onclick = (e) => { e.stopPropagation(); toggle(); };
  trigger.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
      e.preventDefault();
      open();
    }
  };
  panel.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(options.length - 1, activeIndex + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(0, activeIndex - 1)); }
    else if (e.key === 'Enter') { e.preventDefault(); panel.children[activeIndex]?.click(); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); trigger.focus(); }
  };
  wrapper.tabIndex = -1;

  syncTriggerLabel();
  // 把原生 select 也搬进 wrapper（保持事件相对节点的关系）
  nativeSelect.parentNode.insertBefore(wrapper, nativeSelect);
  wrapper.appendChild(nativeSelect);
  wrapper.appendChild(trigger);
  wrapper.appendChild(panel);

  // 外部点击关闭
  document.addEventListener('click', (e) => {
    if (!wrapper.contains(e.target)) close();
  });

  // 外部代码若直接修改 select.value，触发 change 后同步 UI
  nativeSelect.addEventListener('change', () => {
    syncTriggerLabel();
    syncPanelSelected();
  });
}

document.querySelectorAll('select.ai-native').forEach(enhanceSelect);

// 事件绑定
document.getElementById('groupBy').onchange = e => { state.groupBy = e.target.value; render(); };
document.getElementById('sortBy').onchange = e => { state.sortBy = e.target.value; render(); };

// Kind tab 切换
document.querySelectorAll('.kind-tab').forEach(btn => {
  btn.onclick = () => {
    if (btn.classList.contains('active')) return;
    state.kind = btn.dataset.kind;
    document.querySelectorAll('.kind-tab').forEach(b => b.classList.toggle('active', b === btn));
    state.selectedGenres.clear();
    state.excludedGenres.clear();
    state.selectedYears.clear();
    state.selectedStatuses.clear();
    render();
  };
});

// 搜索防抖
let searchTimer;
document.getElementById('searchBox').oninput = e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value;
    render();
  }, 200);
};

// 首次渲染
loadMovies().then(render).catch(() => {});
</script>
</body>
</html>
