{{ define "main" }}
<main>
  <h1 class="page-title">{{ .Title }}</h1>
  {{ $data := .Data }}
  <div class="tag-cloud">
      {{ range $key, $value := .Data.Terms.ByCount }}
      <div class="category-item">
          <a href="{{ $.Site.LanguagePrefix | absURL }}{{ $data.Plural }}/{{ $value.Name | urlize }}/">{{ $value.Name }} ({{ $value.Count }})</a>
      </div>
      {{ end }}
  </div>
</main>
{{ end }}
