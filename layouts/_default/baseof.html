<!DOCTYPE html>
<html>
    {{- partial "header.html" . -}}
    <body>
        <div class="ai-layout">
            <aside class="ai-sidebar">
                <div class="ai-logo">
                    <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
                </div>
                <nav class="ai-nav">
                    {{ range .Site.Menus.main }}
                    <a href="{{ .URL }}" class="ai-nav-item">{{ .Name }}</a>
                    {{ end }}
                </nav>
                <div class="ai-sidebar-leaf">🍃</div>
            </aside>
            <main class="ai-main">
                <div class="content">
                {{- block "main" . }}{{- end }}
                </div>
                {{- partial "footer.html" . -}}
            </main>
        </div>
    </body>
</html>
